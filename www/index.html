<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#C8102E">
<title>股票判断机</title>
<style>
/* ==================================================================
   设计令牌
   - 主视觉：浓郁红（品牌区 / 选中态 / 主按钮）
   - 语义色：只用在「结论 / 命中」这类数据上，不参与品牌表达
   - 圆角卡片 + 半透明底栏（Apple 风）
   ================================================================== */
:root{
  --bg:#f5f5f7; --bg-elev:#ffffff; --bg-group:#ffffff;
  --fill-1:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.16); --fill-3:rgba(120,120,128,.08);
  --text:#1c1c1e; --text-2:rgba(60,60,67,.62); --text-3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.29); --sep-op:rgba(60,60,67,.10);

  --brand:#C8102E; --brand-deep:#8E0000;
  --brand-soft:rgba(200,16,46,.10); --brand-line:rgba(200,16,46,.22);
  --grad:linear-gradient(158deg,#C8102E 0%,#8E0000 100%);
  --on-brand:#ffffff; --on-brand-2:rgba(255,255,255,.82);
  --fill-on-brand:rgba(255,255,255,.20); --fill-on-brand-2:rgba(255,255,255,.30);

  --c-good:#34c759; --c-bad:#ff3b30; --c-wait:#ff9500; --c-veto:#5B0E1E;
  --gray:#8e8e93;

  --nav-bg:rgba(249,249,249,.80);
  --radius:16px; --radius-sm:11px;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --bg-elev:#1c1c1e; --bg-group:#1c1c1e;
    --fill-1:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(120,120,128,.18);
    --text:#fff; --text-2:rgba(235,235,245,.62); --text-3:rgba(235,235,245,.32);
    --sep:rgba(84,84,88,.65); --sep-op:rgba(84,84,88,.42);

    --brand:#ff453a; --brand-deep:#C8102E;
    --brand-soft:rgba(255,69,58,.16); --brand-line:rgba(255,69,58,.32);
    --grad:linear-gradient(158deg,#B00020 0%,#5A0000 100%);
    --on-brand:#ffffff; --on-brand-2:rgba(255,255,255,.80);
    --fill-on-brand:rgba(255,255,255,.20); --fill-on-brand-2:rgba(255,255,255,.30);

    --c-good:#30d158; --c-bad:#ff453a; --c-wait:#ff9f0a; --c-veto:#E8A9B8;
    --gray:#98989d;

    --nav-bg:rgba(28,28,30,.80);
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ★ 宽度铁律：整页绝不横向滚动（原先 table{min-width:430px} 是元凶，已整表删除） */
html,body{margin:0;height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--text);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
img,svg,canvas,video{max-width:100%;height:auto}
button,input,textarea{font:inherit;color:inherit;font-family:inherit;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap,.card,.row,.ann,.jrow,.card-pad,.jq,.jrole,.t1,.t2,.t3{overflow-wrap:anywhere;word-break:break-word}

/* ==================================================================
   顶栏（品牌红，粘顶，含安全区）
   ================================================================== */
.nav{
  position:sticky;top:0;z-index:30;
  background:var(--grad);
  border-bottom:.5px solid var(--brand-line);
  padding:0 0 8px;
  padding-top:env(safe-area-inset-top);
}
.nav-row{display:flex;align-items:center;gap:8px;padding:8px 16px 0;min-height:44px}
.nav-title{flex:1;min-width:0;font-size:17px;font-weight:700;letter-spacing:-.2px;color:var(--on-brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn{
  border:0;background:var(--fill-on-brand);color:var(--on-brand);border-radius:50%;
  width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:15px;padding:0;transition:transform .12s,background .12s;
}
.nav-btn:active{transform:scale(.9);background:var(--fill-on-brand-2)}
.nav-btn.on{background:#fff;color:var(--brand)}
.search{padding:8px 16px 8px}
.search input{
  width:100%;height:36px;border:0;border-radius:var(--radius-sm);padding:0 12px;
  background:var(--fill-on-brand);outline:none;font-size:16px;color:var(--on-brand);
}
.search input::placeholder{color:var(--on-brand-2)}
.segs-wrap{padding:0 16px 6px}
/* 分段控件：自动换行。
   原来是 overflow-x:auto 横向滚动，最右一个分类会被切一半 ——
   和「一页完全显示」的要求直接冲突，改成换行后彻底不出滚动条。 */
.segs{
  display:flex;flex-wrap:wrap;gap:4px;background:var(--fill-on-brand);
  border-radius:9px;padding:3px;
}
.seg{
  flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--on-brand-2);
  font-size:13px;font-weight:500;padding:6px 10px;border-radius:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .15s,color .15s;
}
.seg.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.16)}

/* ==================================================================
   列表
   ================================================================== */
.wrap{padding:0 16px calc(120px + env(safe-area-inset-bottom))}
.big{padding:18px 2px 8px}
.big h1{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.7px;color:var(--brand)}
.big-sub{margin-top:5px;font-size:13px;color:var(--text-2)}

.group{background:var(--bg-group);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.group-hd{
  font-size:13px;color:var(--text-2);padding:2px 4px 6px;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
}
.row{
  display:flex;align-items:center;gap:12px;padding:11px 16px;
  border-bottom:.5px solid var(--sep-op);transition:background .12s;
  position:relative;
}
.row:last-child{border-bottom:0}
.row:active{background:var(--brand-soft)}
.row .main{flex:1;min-width:0}
.row .t1{font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:5px}
.row .t2{font-size:13px;color:var(--text-2);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .t3{font-size:12.5px;color:var(--text-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:var(--c-wait);font-size:13px}
.tag{
  font-size:11.5px;padding:1.5px 7px;border-radius:6px;
  background:var(--fill-1);color:var(--text-2);font-weight:500;
}
.tag.cat{background:var(--brand-soft);color:var(--brand)}
.pill{
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:100px;color:#fff;
  letter-spacing:.2px;flex:0 0 auto;white-space:nowrap;
}
.chev{color:var(--text-3);font-size:15px;flex:0 0 auto}

/* ==================================================================
   详情
   ================================================================== */
.detail{
  position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(112px + env(safe-area-inset-bottom));
}
.detail.show{transform:translateX(0)}
/* ★ 返回按钮被状态栏压住的根因：先写 padding 简写、再写 padding-top 覆盖。
   顺序反了就白写。这里必须「简写在前、padding-top 在后」。 */
.dnav{
  position:sticky;top:0;z-index:5;background:var(--grad);
  border-bottom:.5px solid var(--brand-line);
  padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:6px;min-height:48px;
}
.dnav .back{border:0;background:none;color:var(--on-brand);font-size:17px;padding:4px 2px;display:flex;align-items:center;gap:2px;flex:0 0 auto}
.dnav .back:active{opacity:.5}
.dnav .dt{flex:1;min-width:0;font-size:16px;font-weight:700;color:var(--on-brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.dnav .pad{width:52px;flex:0 0 auto}
.dbody{padding:14px 16px 0}
.hero{padding:18px 16px 14px}
.hero h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.hero .meta{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.card{background:var(--bg-group);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.card-hd{
  font-size:13px;font-weight:700;color:var(--text-2);
  padding:11px 16px 9px;border-bottom:.5px solid var(--sep-op);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card-hd .sub{font-weight:400;color:var(--text-3);font-size:12px;text-align:right;min-width:0}
.card-pad{padding:14px 16px;font-size:15.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}

/* 判断机结果：纵向卡片（替代原来的横向 table，列错位与横向滚动一并消失） */
.jgrp{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:6px 16px;letter-spacing:.2px}
.jrow{padding:11px 16px;border-bottom:.5px solid var(--sep-op)}
.jrow:last-child{border-bottom:0}
.jq{font-size:14.5px;line-height:1.45;color:var(--text)}
.jm{margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.jhit{font-size:12.5px;font-weight:700;flex:0 0 auto}
.jrole{font-size:12.5px;color:var(--text-2);flex:1;min-width:0}

/* 公告列表 */
.ann{display:block;padding:11px 16px;border-bottom:.5px solid var(--sep-op);transition:background .12s}
.ann:last-child{border-bottom:0}
.ann:active{background:var(--brand-soft)}
.ann .at{font-size:14.5px;line-height:1.45;color:var(--text);display:flex;gap:8px;align-items:flex-start}
.ann .at .tx{flex:1;min-width:0}
.ann .at .ext{color:var(--text-3);font-size:12px;flex:0 0 auto;margin-top:2px}
.ann .am{font-size:12px;color:var(--text-2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.more{
  width:100%;border:0;background:transparent;color:var(--brand);
  font-size:14.5px;font-weight:600;padding:13px;border-top:.5px solid var(--sep-op);
}
.more:active{background:var(--brand-soft)}
.empty-row{padding:20px 16px;text-align:center;color:var(--text-3);font-size:14px}
.empty{text-align:center;color:var(--text-2);padding:56px 24px;font-size:15px;line-height:1.7;overflow-wrap:anywhere}

/* 底部操作条（半透明） */
.acts{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep-op);
  display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.acts.show{transform:translateY(0)}
.acts button{
  flex:1;min-width:0;border:0;background:var(--fill-1);border-radius:var(--radius-sm);padding:11px 0;
  font-size:15px;font-weight:600;transition:transform .12s,background .12s;
}
.acts button:active{transform:scale(.96)}
.acts button.primary{background:var(--grad);color:#fff}
.acts button.fav-on{background:rgba(255,149,0,.16);color:var(--c-wait)}

/* ==================================================================
   弹层（sheet）
   ================================================================== */
.mask{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.4);
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;
}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-width:100%;background:var(--bg-elev);border-radius:18px 18px 0 0;
  padding:0 0 calc(12px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;
}
.mask.show .sheet{transform:translateY(0)}
.sheet-grab{width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin:8px auto 4px}
.sheet h3{margin:6px 20px 12px;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.sheet .grp{margin:0 16px 14px;background:var(--bg);border-radius:var(--radius);overflow:hidden}
.sheet label{display:block;font-size:13px;color:var(--text-2);padding:12px 14px 4px}
.sheet input[type=text],.sheet textarea{
  width:100%;border:0;background:transparent;padding:8px 14px 12px;outline:none;
  font-size:14px;line-height:1.5;
}
.sheet textarea{height:96px;resize:none;font-family:ui-monospace,Menlo,Consolas,monospace}
.sheet .hint{font-size:12px;color:var(--text-3);padding:0 14px 12px;line-height:1.5}
.sheet-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:16px;
  border-bottom:.5px solid var(--sep-op);width:100%;border-left:0;border-right:0;border-top:0;
  background:transparent;text-align:left;
}
.sheet-item:last-child{border-bottom:0}
.sheet-item:active{background:var(--fill-3)}
.sheet-item .ic{width:22px;text-align:center;color:var(--brand);flex:0 0 auto}
.sheet-item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-item .chev{color:var(--text-3);font-size:15px;flex:0 0 auto}
.sheet-btns{display:flex;gap:10px;padding:0 16px 8px}
.sheet-btns button{
  flex:1;min-width:0;border:0;border-radius:var(--radius-sm);padding:12px 0;font-size:16px;font-weight:600;
  background:var(--fill-1);
}
.sheet-btns button.primary{background:var(--grad);color:#fff}
.sheet-btns button:active{transform:scale(.97)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(8px);z-index:200;
  background:rgba(0,0,0,.84);color:#fff;padding:9px 18px;border-radius:100px;font-size:14px;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:84vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{
  width:22px;height:22px;border:2.5px solid var(--fill-2);border-top-color:var(--brand);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== v12 新页面体系 ===== */
.app-top{position:sticky;top:0;z-index:40;background:linear-gradient(158deg,#C8102E 0%,#8E0000 100%);color:#fff;padding:env(safe-area-inset-top) 0 10px;border-bottom:.5px solid rgba(255,255,255,.18)}
.top-row{display:flex;align-items:center;gap:10px;padding:8px 16px 2px;min-height:42px}
.top-title{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-back{width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:20px;line-height:1}
.home-search{padding:8px 16px 0}
.home-search input{width:100%;height:38px;border:0;border-radius:12px;padding:0 13px;background:rgba(255,255,255,.18);color:#fff;outline:none}
.home-search input::placeholder{color:rgba(255,255,255,.82)}
.home-count{padding:5px 18px 8px;font-size:13px;color:rgba(255,255,255,.82)}
.page{display:none;min-height:calc(100vh - 58px);padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
.page.show{display:block}
.page-head{font-size:14px;color:var(--text-2);margin:2px 2px 10px}
.stock-card,.menu-card{background:var(--bg-group);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.stock-row{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:.5px solid var(--sep-op)}
.stock-row:last-child{border-bottom:0}
.stock-main{flex:1;min-width:0}
.stock-name{font-size:16px;font-weight:650;overflow-wrap:anywhere}
.stock-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.stock-sub{font-size:12.5px;color:var(--text-2);margin-top:4px;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;font-size:11.5px;padding:2px 7px;border-radius:7px;background:var(--fill-1);color:var(--text-2)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.good{background:rgba(52,199,89,.12);color:var(--c-good)}
.chip.bad{background:rgba(255,59,48,.12);color:var(--c-bad)}
.chip.wait{background:rgba(255,149,0,.13);color:var(--c-wait)}
.stock-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.star-btn{border:0;background:transparent;color:#ff9500;font-size:18px;padding:4px}
.arrow{color:var(--text-3);font-size:18px}
.section-title{font-size:16px;font-weight:750;padding:14px 15px 9px}
.section-count{font-size:12px;color:var(--text-2);font-weight:400}
.menu-row{width:100%;display:flex;align-items:center;gap:12px;padding:15px;border:0;border-bottom:.5px solid var(--sep-op);background:transparent;text-align:left}
.menu-row:last-child{border-bottom:0}
.menu-icon{width:24px;text-align:center;color:var(--brand);font-size:18px}
.menu-main{flex:1;min-width:0}
.menu-title{font-size:16px;font-weight:600}
.menu-desc{font-size:12.5px;color:var(--text-2);margin-top:3px}
.group-card{background:var(--bg-group);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.group-card>summary{list-style:none;cursor:pointer;padding:15px;display:flex;align-items:center;gap:10px;font-weight:700}
.group-card>summary::-webkit-details-marker{display:none}
.group-card[open]>summary{border-bottom:.5px solid var(--sep-op)}
.group-label{flex:1}
.group-num{font-size:12px;color:var(--text-2);font-weight:400}
.edit-card{background:var(--bg-group);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.edit-row{padding:12px 15px;border-bottom:.5px solid var(--sep-op)}
.edit-row:last-child{border-bottom:0}
.edit-label{font-size:12px;color:var(--text-2);margin-bottom:6px}
.edit-select{width:100%;min-height:42px;border:1px solid var(--sep-op);background:var(--fill-3);border-radius:11px;padding:0 11px;outline:none}
.edit-condition{font-size:14px;line-height:1.45;font-weight:600}
.edit-role{font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.45}
.save-bar{display:flex;gap:10px;padding:12px 15px}
.save-bar button{flex:1;border:0;border-radius:11px;padding:12px 0;font-size:15px;font-weight:650}
.btn-primary{background:linear-gradient(158deg,#C8102E 0%,#8E0000 100%);color:#fff}
.btn-secondary{background:var(--fill-1)}
.modified-note{font-size:12px;color:var(--c-wait);padding:0 15px 12px}
.overview-box{overflow:auto;-webkit-overflow-scrolling:touch;border-top:.5px solid var(--sep-op)}
.overview-frame{width:1000px;min-width:100%;height:74vh;border:0;display:block;background:#fff}
.overview-actions{display:flex;gap:10px;padding:10px 15px}
.overview-actions a,.overview-actions button{flex:1;border:0;border-radius:11px;padding:11px 0;text-align:center;background:var(--fill-1);font-size:14px}
.ann-row{padding:12px 15px;border-bottom:.5px solid var(--sep-op)}
.ann-row:last-child{border-bottom:0}
.ann-date{font-size:12px;color:var(--text-2);margin-bottom:4px}
.ann-title{font-size:14.5px;line-height:1.45}
.ann-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ann-link{display:block}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;background:rgba(249,249,249,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep-op);padding:5px 6px calc(5px + env(safe-area-inset-bottom));}
.bottom-btn{flex:1;min-width:0;border:0;background:transparent;border-radius:12px;padding:6px 2px 5px;color:var(--text-2);font-size:11px}
.bottom-btn .bi{display:block;font-size:18px;line-height:18px;margin-bottom:2px}
.bottom-btn.on{color:var(--brand);font-weight:700;background:var(--brand-soft)}
.detail-v12{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);padding-bottom:calc(100px + env(safe-area-inset-bottom))}

<body>
<header class="app-top" id="topbar">
  <div class="top-row">
    <button class="top-back" id="pageBack" style="display:none">‹</button>
    <div class="top-title" id="topTitle">股票</div>
  </div>
  <div id="homeSearch" class="home-search"><input id="q" type="search" placeholder="搜索名称 / 代码" autocomplete="off"></div>
  <div id="homeCount" class="home-count">共 0 条</div>
</header>

<main id="homePage" class="page show">
  <div class="page-head" id="homeHint">正在加载…</div>
  <div id="homeList"></div>
</main>

<main id="typePage" class="page"><div class="page-head">类型</div><div id="typeList"></div></main>

<main id="commentPage" class="page"><div class="page-head">点评</div><div id="commentList"></div></main>
<main id="favoritePage" class="page"><div class="page-head">收藏</div><div id="favoriteList"></div></main>

  <button class="bottom-btn" data-page="conclusions"><span class="bi">◉</span>结论</button>
  <button class="bottom-btn" data-page="comments"><span class="bi">✎</span>点评</button>
  <button class="bottom-btn" data-page="favorites"><span class="bi">★</span>收藏</button>
  <button class="bottom-btn" data-page="settings"><span class="bi">⚙</span>设置</button>
</nav>

<section class="detail-v12" id="detail">
  <div class="dhead"><button class="dback" id="detailBack">‹</button><div class="dtitle" id="detailTitle"></div><div class="dpad"></div></div>
  <div class="dcontent" id="detailContent"></div>
</section>

<div class="sheet-v12" id="sheetMask"><div class="sheet-inner" id="sheetInner"></div></div>
<div class="toast-v12" id="toast"></div>

<script>
const DEF_URLS = '__DATA_URL__';
const UPDATE_URL = 'https://raw.githubusercontent.com/baibiaowang/stock-judge-public/main/update.json';
const LS = {
  fav:'sj.fav.v3', cmt:'sj.cmt.v3', urls:'sj.urls.v3',
  activation:'sj.activation.v4', oldKey:'sj.key.v3',
  overrides:'sj.overrides.v1', cache:'sj.cache.v3', version:'sj.app.version'
};
const PAGE_SIZE = 200;
const ANN_STEP = 30;
const APP_VERSION = '1.2.0';

const state = {
  data:null, kind:null, query:'', page:'home',
  cur:null, annShown:{}, fromHistory:false
};
let favs=new Set(), cmts={}, overrides={};

const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));}
function toast(msg,ms){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),ms||1800);
}
function loadLocal(){
  try{favs=new Set(JSON.parse(localStorage.getItem(LS.fav)||'[]'));}catch(e){favs=new Set();}
  try{cmts=JSON.parse(localStorage.getItem(LS.cmt)||'{}');}catch(e){cmts={};}
  try{overrides=JSON.parse(localStorage.getItem(LS.overrides)||'{}');}catch(e){overrides={};}
  const migrated=localStorage.getItem(LS.activation)||localStorage.getItem(LS.oldKey)||'';
  if(migrated && !localStorage.getItem(LS.activation)) localStorage.setItem(LS.activation,migrated);
}
function saveFav(){try{localStorage.setItem(LS.fav,JSON.stringify([...favs]));}catch(e){}}
function saveCmt(){try{localStorage.setItem(LS.cmt,JSON.stringify(cmts));}catch(e){}}
function saveOverrides(){try{localStorage.setItem(LS.overrides,JSON.stringify(overrides));}catch(e){}}

const IDB=(()=>{
  const DB='stockjudge-v12',STORE='kv',VER=1; let dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      let q;
      try{q=indexedDB.open(DB,VER);}catch(e){rej(e);return;}
      q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE);};
      q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error||new Error('IDB打开失败'));
    }); return dbp;
  }
  function tx(mode,fn){return open().then(db=>new Promise((res,rej)=>{
    let t;try{t=db.transaction(STORE,mode);}catch(e){rej(e);return;}
    const s=t.objectStore(STORE);let r;try{r=fn(s);}catch(e){rej(e);return;}
    t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error||new Error('IDB错误'));t.onabort=()=>rej(t.error||new Error('IDB中止'));
  }));}
  return {get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k))};
})();
const Cache={
  async get(){try{const v=await IDB.get('data');if(v)return v;}catch(e){}try{return JSON.parse(localStorage.getItem(LS.cache)||'null');}catch(e){return null;}},
  async set(d){try{await IDB.set('data',d);try{localStorage.removeItem(LS.cache);}catch(e){}return true;}catch(e){try{localStorage.setItem(LS.cache,JSON.stringify(d));return true;}catch(e2){return false;}}},
  async clear(){try{await IDB.del('data');}catch(e){}try{localStorage.removeItem(LS.cache);}catch(e){}}
};

function getUrls(){
  const custom=(localStorage.getItem(LS.urls)||'').split(/\s*\n\s*/).map(s=>s.trim()).filter(Boolean);
  if(custom.length)return custom;
  return String(DEF_URLS).split(/\s*\n\s*/).map(s=>s.trim()).filter(s=>s&&s.indexOf('__')!==0);
}
function getActivation(){
  const a=(localStorage.getItem(LS.activation)||'').trim();
  if(!/^[0-9a-fA-F]{64}$/.test(a)) throw new Error('请到「设置 → 激活码」填写64位十六进制激活码');
  return a;
}
function hexToBytes(hex){
  const s=String(hex||'').trim();
  if(!/^[0-9a-fA-F]{64}$/.test(s))throw new Error('激活码必须是64位十六进制');
  const o=new Uint8Array(32);for(let i=0;i<32;i++)o[i]=parseInt(s.slice(i*2,i*2+2),16);return o;
}
function b64ToBytes(b64){
  const bin=atob(String(b64).replace(/[^A-Za-z0-9+/=]/g,''));const o=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o;
}
async function decryptText(txt){
  const u=b64ToBytes(txt);
  if(u.length<33)throw new Error('文件过短');
  const magic=String.fromCharCode(u[0],u[1],u[2],u[3]);if(magic!=='SJ01')throw new Error('数据格式不匹配');
  if(!crypto.subtle)throw new Error('当前环境不支持安全解密');
  const iv=u.slice(5,17),data=u.slice(17),key=await crypto.subtle.importKey('raw',hexToBytes(getActivation()),{name:'AES-GCM'},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
  return JSON.parse(new TextDecoder().decode(plain));
}
async function loadFromUrl(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return decryptText(await r.text());}
async function loadRemote(){
  const errs=[];
  for(const u of getUrls()){try{return await loadFromUrl(u);}catch(e){errs.push(u.replace(/^https?:\/\//,'').slice(0,48)+' → '+e.message);}}
  throw new Error(errs.join('；'));
}

function keyOf(r){return String(r.code)+'|'+String(r.category||'');}
function effective(r){
  const o=overrides[keyOf(r)]||{}, x=Object.assign({},r);
  if(o.conclusion!==undefined)x.conclusion=o.conclusion;
  if(Array.isArray(r.judge))x.judge=r.judge.slice();
  if(o.judge && x.judge){Object.keys(o.judge).forEach(i=>{x.judge[Number(i)]=o.judge[i];});}
  return x;
}
function hasModified(r){return !!overrides[keyOf(r)];}
function categories(){
  const s=new Set(Object.keys((state.data&&state.data.judge_tables)||{}));
  (state.data&&state.data.records||[]).forEach(r=>{if(r.category)s.add(r.category);});
  return [...s];
}
function conclusions(){
  const s=new Set();
  (state.data&&state.data.records||[]).forEach(r=>{const x=effective(r).conclusion;if(x)s.add(x);});
  return [...s];
}
function propertyOptions(){
  const s=new Set(['有利','不利','辅助','特色','待定','中性']);
  Object.values((state.data&&state.data.judge_tables)||{}).forEach(t=>(t.rows||[]).forEach(row=>{if(row[1])s.add(row[1]);}));
  return [...s];
}
function judgeOptions(){
  const s=new Set(['有利','不利','待定','不确定','中性','命中','未命中','存在','不存在']);
  (state.data&&state.data.records||[]).forEach(r=>(r.judge||[]).forEach(v=>{if(v)s.add(v);}));
  return [...s];
}
function statusClass(c){if(c==='有利')return'good';if(c==='不利'||c==='否决')return'bad';if(c==='待定')return'wait';return'';}

function filteredHome(){
  const q=state.query.trim().toLowerCase();
  return (state.data.records||[]).map(effective).filter(r=>{
    if(!q)return true;
    return String(r.name||'').toLowerCase().includes(q)||String(r.code||'').includes(q);
  });
}
function stockRow(r,opts){
  const k=keyOf(r),star=favs.has(k),c=cmts[k],mod=hasModified(r);
  return '<div class="stock-row" data-code="'+esc(r.code)+'" data-cat="'+esc(r.category||'')+'">'+
    '<div class="stock-main"><div class="stock-name">'+esc(r.name||r.code)+(star?' <span style="color:#ff9500">★</span>':'')+'</div>'+
    '<div class="stock-meta"><span class="chip">'+esc(r.code)+'</span><span class="chip brand">'+esc(r.category||'未分类')+'</span><span class="chip '+statusClass(r.conclusion)+'">'+esc(r.conclusion||'待定')+'</span>'+(mod?'<span class="chip wait">已修改</span>':'')+'</div>'+
    (c?'<div class="stock-sub">✎ '+esc(c)+'</div>':'')+'</div>'+
    '<div class="stock-right">'+(star&&!opts?.noStar?'<span style="color:#ff9500">★</span>':'')+'<span class="arrow">›</span></div></div>';
}
function bindStockRows(root){
  root.querySelectorAll('.stock-row').forEach(el=>el.onclick=()=>{
    const r=(state.data.records||[]).find(x=>String(x.code)===el.dataset.code&&String(x.category||'')===el.dataset.cat);
    if(r)openDetail(r);
  });
}

function renderHome(){
  if(!state.data)return;
  const rows=filteredHome(); $('homeCount').textContent='共 '+rows.length+' 条';
  $('homeHint').textContent=(state.kind==='local'?'本地导入数据 · 不会被后台刷新覆盖':state.kind==='cache'?'缓存数据':'实时数据');
  $('homeList').innerHTML=rows.length?'<div class="stock-card">'+rows.slice(0,PAGE_SIZE).map(r=>stockRow(r,{})).join('')+'</div>':'<div class="empty">没有匹配的股票</div>';
  bindStockRows($('homeList'));
}

function renderTypes(){
  if(!state.data)return;
  const cs=categories();
  $('typeList').innerHTML=cs.length?cs.map(c=>{
    const rows=(state.data.records||[]).map(effective).filter(r=>r.category===c);
    return '<details class="group-card"><summary><span class="group-label">'+esc(c)+'</span><span class="group-num">'+rows.length+' 条 ›</span></summary>'+
      (rows.length?rows.map(r=>stockRow(r,{noStar:true})).join(''):'<div class="empty">暂无股票</div>')+'</details>';
  }).join(''):'<div class="empty">数据里还没有类型</div>';
  bindStockRows($('typeList'));
}
function renderConclusions(){
  const cs=conclusions();
  $('conclusionList').innerHTML=cs.length?cs.map(c=>{
    const rows=(state.data.records||[]).map(effective).filter(r=>r.conclusion===c);
    return '<details class="group-card"><summary><span class="group-label">'+esc(c)+'</span><span class="group-num">'+rows.length+' 条 ›</span></summary>'+
      (rows.length?rows.map(r=>stockRow(r,{noStar:true})).join(''):'<div class="empty">暂无</div>')+'</details>';
  }).join(''):'<div class="empty">数据里还没有结论</div>';
  bindStockRows($('conclusionList'));
}
function renderComments(){
  const rows=(state.data.records||[]).map(effective).filter(r=>cmts[keyOf(r)]);
  $('commentList').innerHTML=rows.length?'<div class="stock-card">'+rows.map(r=>stockRow(r,{})).join('')+'</div>':'<div class="empty">还没有点评</div>';
  bindStockRows($('commentList'));
}
function renderFavorites(){
  const rows=(state.data.records||[]).map(effective).filter(r=>favs.has(keyOf(r)));
  $('favoriteList').innerHTML=rows.length?'<div class="stock-card">'+rows.map(r=>stockRow(r,{})).join('')+'</div>':'<div class="empty">还没有收藏</div>';
  bindStockRows($('favoriteList'));
}

function settingsHtml(){
  const urls=localStorage.getItem(LS.urls)||'';
  const act=localStorage.getItem(LS.activation)||'';
  return '<div class="menu-card"><div class="section-title">数据源</div>'+
    '<div class="edit-row"><div class="edit-label">数据地址（每行一个）</div><textarea id="setUrls" style="width:100%;min-height:108px;border:0;background:var(--fill-1);border-radius:11px;padding:11px;outline:none">'+esc(urls)+'</textarea></div>'+
    '<div class="save-bar"><button class="btn-primary" id="saveUrls">保存数据源并更新</button></div></div>'+
    '<div class="menu-card"><div class="section-title">激活码</div>'+
    '<div class="edit-row"><div class="edit-label">64位十六进制激活码</div><input id="setActivation" type="text" value="'+esc(act)+'" placeholder="请输入激活码"></div>'+
    '<div class="save-bar"><button class="btn-primary" id="saveActivation">保存激活码</button></div></div>'+
    '<div class="menu-card"><div class="section-title">数据与备份</div>'+
    '<button class="menu-row" id="refreshData"><span class="menu-icon">↻</span><span class="menu-main"><span class="menu-title">立即更新数据</span><span class="menu-desc">连接当前数据源重新获取公告判断结果</span></span><span class="arrow">›</span></button>'+
    '<button class="menu-row" id="importTxt"><span class="menu-icon">↧</span><span class="menu-main"><span class="menu-title">导入加密 TXT</span><span class="menu-desc">导入后作为本地数据，不被后台更新覆盖</span></span><span class="arrow">›</span></button>'+
    '<button class="menu-row" id="exportBackup"><span class="menu-icon">↥</span><span class="menu-main"><span class="menu-title">备份收藏、点评和手动修改</span></span><span class="arrow">›</span></button>'+
    '<button class="menu-row" id="restoreBackup"><span class="menu-icon">↧</span><span class="menu-main"><span class="menu-title">恢复备份</span></span><span class="arrow">›</span></button>'+
    '<button class="menu-row" id="clearCache"><span class="menu-icon">⌫</span><span class="menu-main"><span class="menu-title">清空数据缓存</span></span><span class="arrow">›</span></button></div>'+
    '<div class="menu-card"><div class="section-title">更新</div>'+
    '<div class="edit-row"><div class="edit-label">当前版本</div><div>'+APP_VERSION+'</div></div>'+
    '<button class="menu-row" id="checkUpdate"><span class="menu-icon">⇩</span><span class="menu-main"><span class="menu-title">检查 App 更新</span><span class="menu-desc">有新版本时进入下载页面</span></span><span class="arrow">›</span></button></div>';
}
function renderSettings(){
  $('settingsList').innerHTML=settingsHtml();
  $('saveUrls').onclick=async()=>{
    const v=$('setUrls').value.trim(); if(v)localStorage.setItem(LS.urls,v);else localStorage.removeItem(LS.urls);
    await Cache.clear(); boot(true); toast('数据源已保存');
  };
  $('saveActivation').onclick=()=>{
    const v=$('setActivation').value.trim();
    if(!/^[0-9a-fA-F]{64}$/.test(v)){toast('激活码必须是64位十六进制',2600);return;}
    localStorage.setItem(LS.activation,v); toast('激活码已保存，正在更新'); boot(true);
  };
  $('refreshData').onclick=()=>{state.kind=null;boot(true,true);};
  $('importTxt').onclick=pickFile;
  $('exportBackup').onclick=exportBackup;
  $('restoreBackup').onclick=restoreBackup;
  $('clearCache').onclick=async()=>{await Cache.clear();toast('缓存已清空');};
  $('checkUpdate').onclick=checkUpdate;
}
function renderPage(){
  ['home','types','conclusions','comments','favorites','settings'].forEach(p=>$(p==='home'?'homePage':p==='types'?'typePage':p==='conclusions'?'conclusionPage':p==='comments'?'commentPage':p==='favorites'?'favoritePage':'settingsPage').classList.toggle('show',state.page===p));
  $('homeSearch').style.display=state.page==='home'?'block':'none';
  $('homeCount').style.display=state.page==='home'?'block':'none';
  $('topTitle').textContent=state.page==='home'?'股票':({types:'类型',conclusions:'结论',comments:'点评',favorites:'收藏',settings:'设置'})[state.page];
  $('pageBack').style.display=state.page==='home'?'none':'block';
  document.querySelectorAll('.bottom-btn').forEach(b=>b.classList.toggle('on',({types:'types',conclusions:'conclusions',comments:'comments',favorites:'favorites',settings:'settings'})[b.dataset.page]===state.page));
  if(state.page==='home')renderHome(); else if(state.page==='types')renderTypes(); else if(state.page==='conclusions')renderConclusions(); else if(state.page==='comments')renderComments(); else if(state.page==='favorites')renderFavorites(); else renderSettings();
}
function goPage(page,push){
  if(state.cur)return;
  if(state.page===page)return;
  state.page=page;
  if(push)history.pushState({sjPage:page},'', '#'+page);
  renderPage();
}
document.querySelectorAll('.bottom-btn').forEach(b=>b.onclick=()=>goPage(b.dataset.page,true));
$('pageBack').onclick=()=>history.back();
$('q').addEventListener('input',e=>{state.query=e.target.value;renderHome();});

function saveManualChanges(r){
  const k=keyOf(r), data=state.data, t=data.judge_tables&&data.judge_tables[r.category];
  const o={judge:{}};
  o.conclusion=$('editConclusion').value;
  (t&&t.rows||[]).forEach((row,i)=>{
    const pv=$('prop_'+i), hv=$('hit_'+i);
    if(pv)o.judge[i+'p']=pv.value;
    if(hv)o.judge[i]=hv.value;
  });
  if(o.conclusion===String(r.conclusion||''))delete o.conclusion;
  const cleanJudge={};
  Object.keys(o.judge).forEach(key=>{
    if(key.endsWith('p')){cleanJudge[key.slice(0,-1)]=o.judge[key];}
  });
  const actualJudge={};
  (r.judge||[]).forEach((v,i)=>{if(o.judge[i]!==undefined&&o.judge[i]!==v)actualJudge[i]=o.judge[i];});
  const propObj={};
  (t&&t.rows||[]).forEach((row,i)=>{const val=o.judge[i+'p'];if(val!==undefined&&val!==row[1])propObj[i]=val;});
  const merged=Object.assign({},actualJudge);
  Object.keys(propObj).forEach(i=>merged[i+'p']=propObj[i]);
  const result={};
  if(o.conclusion!==undefined)result.conclusion=o.conclusion;
  if(Object.keys(merged).length)result.judge=merged;
  if(Object.keys(result).length)overrides[k]=result;else delete overrides[k];
  saveOverrides();
  if(state.cur)openDetail(r,true);
  renderAllLists();
  toast('已保存手动修改');
}
function renderAllLists(){if(!state.data)return;renderHome();if(state.page==='types')renderTypes();if(state.page==='conclusions')renderConclusions();if(state.page==='comments')renderComments();if(state.page==='favorites')renderFavorites();}

function findRaw(code,cat){return (state.data.records||[]).find(r=>String(r.code)===String(code)&&String(r.category||'')===String(cat||''));}
function code6(code){const m=String(code||'').match(/\d{6}/);return m?m[0]:String(code||'');}
function overviewUrl(code){return 'https://basic.10jqka.com.cn/'+code6(code)+'/';}
function annTypes(a,r){
  let raw=a.types||a.categories||a.category||a.type||a.tag||a.column||'';
  let arr=Array.isArray(raw)?raw:String(raw).split(/[,、|\//]+/).map(x=>x.trim()).filter(Boolean);
  if(!arr.length&&r.category)arr=[r.category];
  return [...new Set(arr)];
}
function annSort(anns){
  return anns.slice().sort((a,b)=>{
    const da=Date.parse(String(a.date||'').replace(/\./g,'-'))||0, db=Date.parse(String(b.date||'').replace(/\./g,'-'))||0;
    return db-da;
  });
}
function annHtml(r){
  const all=annSort((state.data.announcements&&state.data.announcements[r.code])||[]);
  if(!all.length)return '<div class="dcard"><div class="dcard-head">公告列表 · 0 条</div><div class="dcard-pad">暂无公告</div></div>';
  const shown=all.slice(0,state.annShown[r.code]||ANN_STEP);
  const rows=shown.map(a=>{
    const ts=annTypes(a,r);
    return '<a class="ann-row ann-link" href="'+esc(a.url||'#')+'" target="_blank" rel="noopener">'+
      '<div class="ann-date">'+esc(a.date||'')+(a.column?' · '+esc(a.column):'')+'</div>'+
      '<div class="ann-title">'+esc(a.title||'未命名公告')+'</div>'+
      '<div class="ann-tags">'+ts.map(t=>'<span class="chip brand">'+esc(t)+'</span>').join('')+'</div></a>';
  }).join('');
  const more=all.length>(state.annShown[r.code]||ANN_STEP)?'<button class="menu-row" id="annMore" style="width:100%;border-top:.5px solid var(--sep-op)">展开全部（共 '+all.length+' 条）</button>':'';
  return '<div class="dcard"><div class="dcard-head">公告列表 · 共 '+all.length+' 条 <span style="float:right;font-weight:400">最新在上</span></div>'+rows+more+'</div>';
}

function openDetail(raw,stayHistory){
  const oldKey=state.cur?keyOf(state.cur):'';
  const r=effective(raw||state.cur), key=keyOf(r);
  state.cur=raw;
  if(!stayHistory && oldKey!==key)history.pushState({sjDetail:true},'', '#detail');
  const t=state.data.judge_tables&&state.data.judge_tables[r.category];
  const pOps=propertyOptions(), hOps=judgeOptions(), cOps=conclusions();
  let edits='<div class="edit-row"><div class="edit-label">结论</div><select class="edit-select" id="editConclusion">'+
    cOps.map(c=>'<option value="'+esc(c)+'"'+(c===r.conclusion?' selected':'')+'>'+esc(c)+'</option>').join('')+
    '</select></div>';
  (t&&t.rows||[]).forEach((row,i)=>{
    const prop=((overrides[key]&&overrides[key].judge&&overrides[key].judge[i+'p'])!==undefined)?overrides[key].judge[i+'p']:row[1];
    const hit=((overrides[key]&&overrides[key].judge&&overrides[key].judge[i])!==undefined)?overrides[key].judge[i]:(r.judge&&r.judge[i])||'不确定';
    edits+='<div class="edit-row"><div class="edit-condition">'+esc(row[0])+'</div><div class="edit-role">'+esc(row[2]||'')+'</div>'+
      '<div class="edit-label" style="margin-top:9px">性质</div><select class="edit-select" id="prop_'+i+'">'+pOps.map(v=>'<option value="'+esc(v)+'"'+(v===prop?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select>'+
      '<div class="edit-label" style="margin-top:9px">判断结果</div><select class="edit-select" id="hit_'+i+'">'+hOps.map(v=>'<option value="'+esc(v)+'"'+(v===hit?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select></div>';
  });
  const c=cmts[key]||'';
  const modified=hasModified(r);
  $('detailTitle').textContent=r.name||r.code;
  $('detailContent').innerHTML=
    '<div class="dhero"><h1>'+esc(r.name||r.code)+'</h1><div class="dmeta"><span class="chip">'+esc(r.code)+'</span><span class="chip brand">'+esc(r.category||'未分类')+'</span><span class="chip '+statusClass(r.conclusion)+'">'+esc(r.conclusion||'待定')+'</span>'+(modified?'<span class="chip wait">已修改</span>':'')+'</div></div>'+
    '<div class="dcard"><div class="dcard-head">判断结果与性质</div><div class="edit-card">'+edits+'<div class="save-bar"><button class="btn-secondary" id="resetManual">撤销本票修改</button><button class="btn-primary" id="saveManual">保存修改</button></div>'+(modified?'<div class="modified-note">本票存在本地手动修改，更新数据时不会被覆盖。</div>':'')+'</div></div>'+
    '<div class="dcard"><div class="dcard-head">AI 总结</div><div class="dcard-pad">'+esc(r.summary||'—')+'</div></div>'+
    '<div class="dcard"><div class="dcard-head">我的点评</div><div class="dcard-pad">'+(c?esc(c):'<span style="color:var(--text-3)">还没有点评</span>')+'</div><div class="save-bar"><button class="btn-primary" id="editComment">编辑点评</button></div></div>'+
    '<div class="dcard"><div class="dcard-head">公司概况</div><div class="overview-box"><iframe class="overview-frame" src="'+esc(overviewUrl(r.code))+'" title="同花顺公司概况" loading="lazy"></iframe></div><div class="overview-actions"><a href="'+esc(overviewUrl(r.code))+'" target="_blank" rel="noopener">新窗口打开</a></div></div>'+
    annHtml(r);
  $('detail').classList.add('show');$('bottomNav').style.display='none';
  $('saveManual').onclick=()=>saveManualChanges(raw);
  $('resetManual').onclick=()=>{
    delete overrides[key];saveOverrides();openDetail(raw,true);renderAllLists();toast('已撤销本票手动修改');
  };
  $('editComment').onclick=()=>commentSheet(raw);
  const more=$('annMore'); if(more)more.onclick=()=>{state.annShown[r.code]=(state.annShown[r.code]||ANN_STEP)+ANN_STEP;openDetail(raw,true);};
}
function closeDetail(){
  $('detail').classList.remove('show');$('bottomNav').style.display='flex';state.cur=null;renderPage();
}

function commentSheet(raw){
  const r=effective(raw), k=keyOf(r);
  $('sheetInner').innerHTML='<h3>点评 · '+esc(r.name)+'</h3><textarea id="sheetCmt" placeholder="写下你的判断…">'+esc(cmts[k]||'')+'</textarea><div class="sheet-actions"><button class="btn-secondary" id="sheetCancel">取消</button><button class="btn-primary" id="sheetSave">保存</button></div>';
  $('sheetMask').classList.add('show');history.pushState({sjSheet:true,sjDetail:true},'','#sheet');
  $('sheetCancel').onclick=()=>history.back();
  $('sheetSave').onclick=()=>{const v=$('sheetCmt').value.trim();if(v)cmts[k]=v;else delete cmts[k];saveCmt();history.back();setTimeout(()=>{if(state.cur)openDetail(state.cur,true);renderAllLists();toast('点评已保存');},0);};
}
function closeSheet(){ $('sheetMask').classList.remove('show'); }
$('detailBack').onclick=()=>history.back();
$('sheetMask').onclick=e=>{if(e.target===$('sheetMask'))history.back();};

function pickFile(){
  const input=document.createElement('input');input.type='file';input.accept='.txt,text/plain';
  input.onchange=()=>{const f=input.files&&input.files[0];if(!f)return;const fr=new FileReader();
    fr.onload=async()=>{try{const d=await decryptText(fr.result);await Cache.set(d);apply(d,'local');toast('导入成功，本地数据不会被后台刷新覆盖');}catch(e){toast('导入失败：'+e.message,3000);}};
    fr.onerror=()=>toast('文件读取失败',2400);fr.readAsText(f);
  };input.click();
}
function exportBackup(){
  const payload={kind:'stock-judge-backup',version:2,exported_at:new Date().toISOString(),favorites:[...favs],comments:cmts,overrides};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='stock-judge-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('备份已导出');
}
function restoreBackup(){
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.onchange=()=>{const f=input.files&&input.files[0];if(!f)return;const fr=new FileReader();
    fr.onload=()=>{try{const p=JSON.parse(fr.result);(p.favorites||[]).forEach(k=>{if(typeof k==='string')favs.add(k);});
      if(p.comments&&typeof p.comments==='object')Object.assign(cmts,p.comments);
      if(p.overrides&&typeof p.overrides==='object')Object.assign(overrides,p.overrides);
      saveFav();saveCmt();saveOverrides();renderAllLists();if(state.cur)openDetail(state.cur,true);toast('备份已恢复');}catch(e){toast('恢复失败：'+e.message,2800);}};
    fr.readAsText(f);
  };input.click();
}
function verNum(v){return String(v||'').split('.').map(x=>parseInt(x,10)||0).concat([0,0,0]).slice(0,3);}
function newerVersion(a,b){const x=verNum(a),y=verNum(b);for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i];}return false;}
async function checkUpdate(){
  try{
    const r=await fetch(UPDATE_URL,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json(), latest=String(j.version||'');
    if(latest && newerVersion(latest,APP_VERSION)){
      const ok=confirm('发现新版本 '+latest+'，现在打开下载页面？');
      if(ok&&j.apk_url)location.href=j.apk_url;
      else if(ok&&j.url)location.href=j.url;
    }else toast('当前已是最新版本');
  }catch(e){toast('检查更新失败：'+e.message,2600);}
}

async function boot(silent,forceRemote){
  loadLocal();
  if(state.kind==='local'&&!forceRemote){renderPage();return;}
  let cached=null;try{cached=await Cache.get();}catch(e){}
  if(cached && !forceRemote){apply(cached,'cache');}
  try{
    const d=await loadRemote();
    const ok=await Cache.set(d);if(!ok&& !silent)toast('数据已更新，但缓存写入失败',2600);
    apply(d,'remote');if(silent)toast('已更新到最新数据');
  }catch(e){
    if(!cached){$('homeHint').textContent='加载失败';$('homeList').innerHTML='<div class="empty">'+esc(e.message)+'<br><br>请到「设置」填写激活码和数据源</div>';}
    else if(!silent)toast('更新失败，继续显示缓存数据');
  }
}
function apply(d,kind){
  state.data=d;state.kind=kind;renderPage();
}
window.addEventListener('popstate',e=>{
  if($('sheetMask').classList.contains('show')){closeSheet();return;}
  if($('detail').classList.contains('show')){closeDetail();return;}
  const p=e.state&&e.state.sjPage||'home';state.page=p;renderPage();
});
window.addEventListener('sjOpenFile',e=>{
  decryptText(e.detail.text).then(async d=>{await Cache.set(d);apply(d,'local');toast('已打开导入文件');}).catch(err=>toast('打开失败：'+err.message,2800));
});
(function(){
  let tries=0;const timer=setInterval(async()=>{
    const p=window.__SJ_INCOMING_PATH__;
    if(p){window.__SJ_INCOMING_PATH__=null;clearInterval(timer);try{let u=p;if(window.Capacitor&&window.Capacitor.convertFileSrc)u=window.Capacitor.convertFileSrc(p);const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);const d=await decryptText(await r.text());await Cache.set(d);apply(d,'local');toast('已打开外部文件');}catch(e){toast('打开失败：'+e.message,2800);}}
    if(++tries>240)clearInterval(timer);
  },500);
})();
history.replaceState({sjPage:'home'},'',location.pathname);
loadLocal();
boot(false);
</script>
</body>
</html>
